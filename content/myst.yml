version: 1
project:
  title: JBMTemplate
  authors:
    - name: Adrien Babet
  abstract: A processor to convert from marimo notebooks to MyST markdown files ready for rendering by Jupyter-Book-Marimo.
  plugins:
    - type: executable
      # path: ../.venv/Scripts/jupyter-book-marimo.exe # Windows
      path: ../.venv/bin/jupyter-book-marimo # Unix
  toc:
    - file: index.md
    - file: example.md
    - file: glossary.md

site:
  template: book-theme
  options:
    favicon: ../assets/jbmarimo-template.png
    logo: ../assets/jbmarimo-template.png
    logo_dark: ../assets/jbmarimo-template.png
    logo_text: Jupyter Book Marimo Template